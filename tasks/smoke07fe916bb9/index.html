<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hello NewEra</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='12' fill='%230d1117'/%3E%3Cpath d='M14 32V16l12 14V16' fill='none' stroke='%234C8DFF' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='35' cy='17' r='3' fill='%234C8DFF'/%3E%3C/svg%3E">
<style>
  :root {
    --bg-0: #0d1117;
    --bg-1: #131a24;
    --bg-2: #1b2431;
    --line: #2a3543;
    --text-1: #eef2f7;
    --text-2: #9aa7b8;
    --accent: #4C8DFF;
    --accent-strong: #6ba1ff;
    --accent-soft: rgba(76, 141, 255, 0.14);
    --ring: rgba(76, 141, 255, 0.45);

    --space-1: 8px;
    --space-2: 16px;
    --space-3: 24px;
    --space-4: 32px;
    --space-5: 48px;
    --space-6: 64px;

    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 18px;

    --shadow-lift: 0 10px 30px rgba(0, 0, 0, 0.35);
    --shadow-soft: 0 1px 0 rgba(255, 255, 255, 0.04) inset;

    --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue",
            "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;

    --duration: 220ms;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
  }

  body {
    background:
      radial-gradient(900px 520px at 50% -10%, rgba(76, 141, 255, 0.10), transparent 60%),
      var(--bg-0);
    color: var(--text-1);
    font-family: var(--font);
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    overflow-x: hidden;
  }

  .page {
    width: 100%;
    max-width: 720px;
    margin: 0 auto;
    padding: var(--space-6) var(--space-4) var(--space-4);
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  .mark {
    display: flex;
    justify-content: center;
    margin-bottom: var(--space-6);
  }

  .mark svg {
    width: 56px;
    height: 56px;
    display: block;
    opacity: 0.95;
  }

  .intro {
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: var(--space-3);
  }

  .title {
    margin: 0;
    font-size: clamp(2.25rem, 7vw, 3.5rem);
    line-height: 1.15;
    font-weight: 700;
    letter-spacing: -0.02em;
    background: linear-gradient(180deg, #ffffff 0%, #b9c6d6 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .subtitle {
    margin: 0;
    font-size: 1.0625rem;
    font-weight: 600;
    color: var(--accent-strong);
    letter-spacing: 0.01em;
  }

  .lead {
    margin: 0;
    max-width: 46ch;
    color: var(--text-2);
    font-size: 1rem;
  }

  .rule {
    width: 64px;
    height: 2px;
    border: 0;
    margin: var(--space-2) 0 0;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    opacity: 0.7;
  }

  .spacer {
    flex: 1 1 auto;
    min-height: var(--space-6);
  }

  .actions {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: var(--space-3);
  }

  .btn {
    appearance: none;
    border: 1px solid var(--accent);
    background: var(--accent);
    color: #ffffff;
    font-family: inherit;
    font-size: 1rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    padding: 14px 40px;
    border-radius: var(--radius-md);
    cursor: pointer;
    box-shadow: var(--shadow-lift);
    transition: background var(--duration) ease, transform var(--duration) ease,
                box-shadow var(--duration) ease, opacity var(--duration) ease,
                border-color var(--duration) ease;
  }

  .btn:hover {
    background: var(--accent-strong);
    border-color: var(--accent-strong);
    transform: translateY(-2px);
    box-shadow: 0 14px 34px rgba(76, 141, 255, 0.28);
  }

  .btn:active {
    transform: translateY(0);
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
  }

  .btn:focus-visible {
    outline: 3px solid var(--ring);
    outline-offset: 3px;
  }

  .btn[disabled] {
    cursor: default;
    opacity: 0.45;
    transform: none;
    box-shadow: none;
    border-color: var(--accent);
  }

  .toast {
    margin: 0;
    min-height: 1.7em;
    font-size: 0.9375rem;
    color: var(--accent-strong);
    opacity: 0;
    transform: translateY(4px);
    transition: opacity 320ms ease, transform 320ms ease;
  }

  .toast.show {
    opacity: 1;
    transform: translateY(0);
  }

  .footer {
    margin-top: var(--space-6);
    padding-top: var(--space-3);
    border-top: 1px solid var(--line);
    text-align: center;
    color: var(--text-2);
    font-size: 0.8125rem;
    letter-spacing: 0.02em;
  }

  @media (max-width: 480px) {
    .page {
      padding: var(--space-5) var(--space-3) var(--space-3);
    }

    .mark { margin-bottom: var(--space-5); }
    .mark svg { width: 44px; height: 44px; }

    .title { font-size: clamp(2rem, 10vw, 2.5rem); }
    .subtitle { font-size: 1rem; }
    .lead { font-size: 0.9375rem; }

    .btn { width: 100%; max-width: 320px; padding: 13px 24px; }

    .footer { font-size: 0.75rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
  <main class="page">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" focusable="false">
        <rect x="3" y="3" width="42" height="42" rx="12" stroke="#4C8DFF" stroke-width="2"/>
        <path d="M14 30V18l10 12V18" stroke="#4C8DFF" stroke-width="2.5"
              stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="34" cy="18" r="3" fill="#4C8DFF"/>
      </svg>
    </div>

    <section class="intro">
      <h1 class="title">Hello NewEra</h1>
      <p class="subtitle">欢迎来到 NewEra</p>
      <hr class="rule">
      <p class="lead">这是一句欢迎文案：Hello NewEra 在这里向你问好，愿你在这里开启一段新的体验。</p>
    </section>

    <div class="spacer"></div>

    <section class="actions">
      <button class="btn" id="cta" type="button">开始体验</button>
      <p class="toast" id="toast" role="status" aria-live="polite"></p>
    </section>

    <footer class="footer">© 2025 NewEra · Hello NewEra</footer>
  </main>

<script>
  (function () {
    var button = document.getElementById('cta');
    var toast = document.getElementById('toast');

    if (!button || !toast) { return; }

    button.addEventListener('click', function () {
      if (button.disabled) { return; }
      button.textContent = '已欢迎';
      button.disabled = true;
      toast.textContent = '欢迎来到 NewEra，祝你体验愉快。';
      toast.classList.add('show');
    });
  })();
</script>
</body>
</html>
